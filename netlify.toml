# Netlify build config for the Vite SPA in frontend/
# Deploy settings (base directory, etc.) are read from here so the
# dashboard fields can be left blank.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes (React Router)
# so deep links / refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
